[build]
  command = "pnpm build:deploy"
  ignore = "node ./scripts/netlify-ignore-build.mjs"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "22.17.1"

[[redirects]]
  from = "/blackhole/*"
  to = "/luminet/:splat"
  status = 301
  force = true

[[headers]]
  for = "/cssflower/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssgears/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssgears/scenes/*.gz"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssgravitywell/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssgravitywell/model/gravitywell/*.json.br"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/json"
    Content-Encoding = "br"

[[headers]]
  for = "/cssgravitywell/banks/*/scene.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cssgravitywell/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/csscyclone/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csscyclone/blocks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csscloth/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/csscloth/playback-bank-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csscloth/mobile/playback-bank-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csscloth/model/cloth/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csscloth/mobile/model/cloth-mobile/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssgalaxy/g3/1500/seed-2298/*.bin.br"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"

[[headers]]
  for = "/cssgalaxy/g2/1000/seed-4947/*.bin.br"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"

[[headers]]
  for = "/cssgalaxy/prepared.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/cssgalaxy/g3/1500/catalog.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/cssgalaxy/g2/1000/catalog.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/cssgalaxy/g3/1500/snapshot.html"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssgalaxy/g2/1000/snapshot.html"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csschaos/*.bin.br"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"

[[headers]]
  for = "/csschaos/prepared.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/csschaos/snapshot.html"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssblackhole/banks/*.bin.br"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"

[[headers]]
  for = "/cssblackhole/rails/*.bin.br"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"

[[headers]]
  for = "/cssblackhole/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/cssmenger/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssmaze/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssmaze/scenes/*.gz"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csssolitaire/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/csssolitaire/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cssselectropaint/variants/*/chunks/*.gz"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssselectropaint/variants/*/*.gz"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cssselectropaint/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
